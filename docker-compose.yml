# Variáveis: na pasta DESTE ficheiro (ex.: /opt/evolution no VPS):
#   cp evolution-stack.env.example .env
# O .env.example vem do repositório (vyria-delivery/); se não existir no servidor,
# faz git pull / copia o ficheiro por SCP a partir do teu PC.
# docker compose lê .env automaticamente para ${...} e injeta nos serviços.
#
# SERVER_URL: em produção usa HTTPS (reverse proxy + domínio); ver evolution-stack.env.example.
# Redis: default DB 0; só mudes o índice se este Redis for partilhado com outra aplicação.

services:
  postgres:
    image: postgres:15
    container_name: evolution-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Cria .env a partir de evolution-stack.env.example}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: evolution-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  evolution:
    image: evoapicloud/evolution-api:latest
    container_name: evolution-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: ${SERVER_URL:?Define SERVER_URL no .env — URL pública da Evolution}
      AUTHENTICATION_API_KEY: ${AUTHENTICATION_API_KEY:?Define AUTHENTICATION_API_KEY no .env}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${POSTGRES_PASSWORD}@postgres:5432/evolution
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: ${CACHE_REDIS_URI:-redis://redis:6379/0}
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      LOG_LEVEL: ERROR

  manager:
    build:
      context: .
      dockerfile: Dockerfile.evolution-manager
    image: evolution-manager:patched
    container_name: evolution-manager
    restart: unless-stopped
    depends_on:
      - evolution
    ports:
      - "3000:80"

volumes:
  postgres_data:
  redis_data:
